<!doctype html>
<html lang="{{language}}" dir="{{direction}}" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>Tuxee {{hostname}}</title>
<meta name="tuxee-hostname" content="{{hostname}}">
<meta name="tuxee-version" content="{{version}}">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<meta name="description" content="{{tagline}}">
<meta property="og:type" content="website">
<meta property="og:title" content="Tuxee">
<meta property="og:description" content="{{tagline}}">
<meta property="og:url" content="{{origin}}/">
<meta property="og:image" content="{{origin}}/social-preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{previewAlt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tuxee">
<meta name="twitter:description" content="{{tagline}}">
<meta name="twitter:image" content="{{origin}}/social-preview.jpg">
<meta name="twitter:image:alt" content="{{previewAlt}}">
<script id="tuxee-i18n" type="application/json">{{i18n}}</script>
<!-- tuxee:styles --><!-- tuxee:script --></head>
<body><div id="app"><div class="boot" role="status" aria-label="{{loading}}"></div></div><div id="transfers" aria-live="polite"></div><div id="notifications" aria-live="polite"></div></body>
</html>
